<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>思考道場 — ビジネススキルを毎日ひとつ鍛える</title>
<meta name="theme-color" content="#14171C" />
<link rel="manifest" href="/manifest.json" />
<!-- iOS PWA -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="思考道場" />
<link rel="apple-touch-icon" href="/icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  /* スプラッシュ（Reactマウントまでの間だけ表示） */
  #splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;
    align-items:center;justify-content:center;background:#14171C;color:#E7EAEE;
    font-family:"Zen Kaku Gothic New",system-ui,sans-serif;transition:opacity .4s ease;}
  #splash.hide{opacity:0;pointer-events:none;}
  #splash .k{font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.26em;
    color:#5E6672;text-transform:uppercase;}
  #splash h1{margin:6px 0 0;font-weight:900;font-size:26px;letter-spacing:.05em;}
  #splash h1 .d{color:#E8523F;}
  #splash .sp{margin-top:18px;width:16px;height:16px;border:2px solid rgba(255,255,255,.25);
    border-top-color:#E8523F;border-radius:50%;animation:sp .7s linear infinite;}
  @keyframes sp{to{transform:rotate(360deg);}}
</style>
</head>
<body>
  <div id="splash">
    <span class="k">Business Skill Gym</span>
    <h1>思考道場<span class="d">.</span></h1>
    <div class="sp"></div>
  </div>
  <div id="root"></div>
  <script>
    // Reactが hideSplash を呼ぶ。保険として5秒でも必ず消す。
    window.hideSplash = function () {
      var s = document.getElementById('splash');
      if (s) { s.classList.add('hide'); setTimeout(function () { s.remove(); }, 450); }
    };
    setTimeout(function () { if (window.hideSplash) window.hideSplash(); }, 5000);
  </script>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
